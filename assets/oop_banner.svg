<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Black Background -->
  <rect width="1280" height="640" fill="#000000"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2cbf;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Geometric background elements representing classes -->
  <g opacity="0.15">
    <rect x="100" y="100" width="200" height="150" fill="none" stroke="#00d4ff" stroke-width="2" rx="5"/>
    <rect x="350" y="180" width="180" height="130" fill="none" stroke="#00d4ff" stroke-width="2" rx="5"/>
    <rect x="980" y="120" width="190" height="140" fill="none" stroke="#7b2cbf" stroke-width="2" rx="5"/>
    <rect x="850" y="350" width="220" height="160" fill="none" stroke="#7b2cbf" stroke-width="2" rx="5"/>
    
    <!-- Connection lines representing inheritance -->
    <line x1="300" y1="175" x2="350" y2="245" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.5"/>
    <line x1="530" y1="245" x2="850" y2="430" stroke="#7b2cbf" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.5"/>
  </g>
  
  <!-- Code snippets background -->
  <g opacity="0.08" font-family="'Courier New', monospace" font-size="14" fill="#00d4ff">
    <text x="120" y="130">class Base {</text>
    <text x="140" y="150">protected:</text>
    <text x="160" y="170">int data;</text>
    <text x="120" y="190">};</text>
    
    <text x="1000" y="150">virtual void</text>
    <text x="1000" y="170">method() = 0;</text>
  </g>
  
  <!-- Central focus area -->
  <g filter="url(#glow)">
    <!-- C++ title at top center -->
    <text x="640" y="240" font-family="'Arial', sans-serif" font-size="100" font-weight="bold" 
          fill="url(#grad2)" text-anchor="middle">
      C++
    </text>
    
    <!-- Main title -->
    <text x="640" y="360" font-family="'Arial', sans-serif" font-size="80" font-weight="bold" 
          fill="url(#grad2)" text-anchor="middle">
      OBJECT-ORIENTED
    </text>
    <text x="640" y="440" font-family="'Arial', sans-serif" font-size="80" font-weight="bold" 
          fill="url(#grad2)" text-anchor="middle">
      PROGRAMMING
    </text>
  </g>
  
  <!-- Bottom accent line -->
  <line x1="0" y1="630" x2="1280" y2="630" stroke="url(#grad2)" stroke-width="3"/>
</svg>